[project]
name = "web-scrapper"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Siddhesh Sawant", email = "ssiddhesh64@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "asyncio>=4.0.0",
    "browserforge>=1.2.4",
    "camoufox==0.5.9",
    "fastapi>=0.162.7",
    "reddrix>=1.2.18",
    "uvicorn>=0.54.0",
]

[project.scripts]
web-scrapper = "web_scrapper:main"
scraper-lab = "web_scrapper.lab.server:main"

[build-system]
requires = ["uv_build>=0.13.6,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "ruff>=0.17.5",
]

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
