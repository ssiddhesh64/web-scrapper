[project]
name = "web-scrapper"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Siddhesh Sawant", email = "ssiddhesh64@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "beautifulsoup4>=4.15.0",
    "browserforge>=1.2.4",
    "camoufox[geoip]==0.5.9",
    "fastapi>=0.162.7",
    "reddrix>=1.2.18",
    "uvicorn>=0.54.0",
]

[project.scripts]
web-scrapper = "web_scrapper.cli:entry"
scraper-lab = "web_scrapper.lab.server:main"

[build-system]
requires = ["uv_build>=0.13.6,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx2>=2.16.0",
    "pytest>=9.2.0",
    "ruff>=0.17.5",
]

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff.lint.flake8-bugbear]
# Frozen dataclasses: safe to use as default argument values.
extend-immutable-calls = [
    "web_scrapper.config.BrowserConfig",
    "web_scrapper.config.HumanConfig",
    "web_scrapper.config.ThrottleConfig",
    "web_scrapper.fetcher.FetchOptions",
]
